<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bunga Iris</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Prediksi Jenis Bunga Iris</h2>
        
        <!-- Tambahkan ID 'predictionForm' pada form -->
        <form id="predictionForm" action="/predict" method="POST">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Sepal Length</label>
                    <input type="number" step="0.1" name="sepal_l" value="{{ sl }}" class="form-control" placeholder="Contoh: 5.0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sepal Width</label>
                    <input type="number" step="0.1" name="sepal_w" value="{{ sw }}" class="form-control" placeholder="Contoh: 3.6" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Petal Length</label>
                    <input type="number" step="0.1" name="petal_l" value="{{ pl }}" class="form-control" placeholder="Contoh: 1.4" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Petal Width</label>
                    <input type="number" step="0.1" name="petal_w" value="{{ pw }}" class="form-control" placeholder="Contoh: 0.2" required>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-5">Prediksi Sekarang</button>
            </div>
        </form>

        {% if prediction %}
            <div class="alert alert-success mt-4 text-center fs-5">
                Hasil Prediksi: <strong>Bunga Iris dengan tipe : {{ prediction }}</strong>
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-danger mt-4">
                <strong>Terjadi Kesalahan:</strong> {{ error }}
            </div>
        {% endif %}
    </div>

    <!-- Modal Loading -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="modal-body">
                    <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h5>Sedang memproses model KNN...</h5>
                    <p class="text-muted mb-0">Mohon tunggu sebentar.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Wajib: Tambahkan Bootstrap JS untuk menjalankan Modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script untuk memunculkan modal saat form disubmit -->
    <script>
        document.getElementById('predictionForm').addEventListener('submit', function() {
            var loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
            loadingModal.show();
        });
    </script>
</body>
</html>
