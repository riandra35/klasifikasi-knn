<!DOCTYPE html>
<html lang="id">
<head>
    <title>Prediksi Bunga Iris</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Prediksi Jenis Bunga Iris</h2>
    
    <form action="/predict" method="POST" class="mt-3">
        <div class="row">
            <div class="col-md-3"><input type="number" step="0.1" name="sepal_l" value="{{ sl or '' }}" class="form-control" placeholder="Sepal Length" required></div>
            <div class="col-md-3"><input type="number" step="0.1" name="sepal_w" value="{{ sw or '' }}" class="form-control" placeholder="Sepal Width" required></div>
            <div class="col-md-3"><input type="number" step="0.1" name="petal_l" value="{{ pl or '' }}" class="form-control" placeholder="Petal Length" required></div>
            <div class="col-md-3"><input type="number" step="0.1" name="petal_w" value="{{ pw or '' }}" class="form-control" placeholder="Petal Width" required></div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Prediksi</button>
    </form>

    {% if prediction %}
        <div class="alert alert-success mt-4">Hasil Prediksi: <strong>{{ prediction }}</strong></div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger mt-4">Terjadi Kesalahan: {{ error }}</div>
    {% endif %}
</body>
</html>
