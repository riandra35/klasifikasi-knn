<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bunga Iris | AI Model</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Pengaturan Font Global */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* Background Parallax */
        .parallax-bg {
            /* Background bunga estetik dari Unsplash */
            background-image: url('https://images.unsplash.com/photo-1558293842-c0fd3db86157?q=80&w=1920&auto=format&fit=crop');
            min-height: 100vh;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        /* Efek Glassmorphism untuk Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85); /* Putih transparan */
            backdrop-filter: blur(12px); /* Efek blur ala kaca */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            width: 100%;
            max-width: 900px;
            /* Animasi masuk */
            animation: fadeInUp 0.8s ease-out;
        }

        /* Animasi Tombol saat di-hover */
        .btn-custom {
            transition: all 0.3s ease;
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.4);
        }

        /* Animasi Input Focus */
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
            border-color: #28a745;
        }

        /* Animasi Hasil Prediksi */
        .result-animate {
            animation: bounceIn 0.6s ease-out;
            border-radius: 15px;
        }

        /* Keyframes Animasi */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Wrapper Parallax -->
    <div class="parallax-bg">
        <div class="container d-flex justify-content-center">
            
            <!-- Glass Card -->
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-success"><i class="fas fa-seedling me-2"></i>Prediksi Bunga Iris</h2>
                    <p class="text-muted">Masukkan dimensi kelopak bunga untuk menebak spesiesnya dengan AI.</p>
                </div>
                
                <form id="predictionForm" action="/predict" method="POST">
                    <div class="row g-4">
                        <!-- Sepal Length -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Sepal Length (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-success"><i class="fas fa-arrows-alt-h"></i></span>
                                <input type="number" step="0.1" name="sepal_l" value="{{ sl }}" class="form-control" placeholder="Contoh: 5.0" required>
                            </div>
                        </div>
                        
                        <!-- Sepal Width -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Sepal Width (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-success"><i class="fas fa-arrows-alt-v"></i></span>
                                <input type="number" step="0.1" name="sepal_w" value="{{ sw }}" class="form-control" placeholder="Contoh: 3.6" required>
                            </div>
                        </div>
                        
                        <!-- Petal Length -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Petal Length (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-success"><i class="fas fa-leaf"></i></span>
                                <input type="number" step="0.1" name="petal_l" value="{{ pl }}" class="form-control" placeholder="Contoh: 1.4" required>
                            </div>
                        </div>
                        
                        <!-- Petal Width -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Petal Width (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-success"><i class="fas fa-seedling"></i></span>
                                <input type="number" step="0.1" name="petal_w" value="{{ pw }}" class="form-control" placeholder="Contoh: 0.2" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center mt-5">
                        <button type="submit" class="btn btn-success btn-lg px-5 btn-custom">
                            <i class="fas fa-magic me-2"></i>Prediksi Sekarang
                        </button>
                    </div>
                </form>

                <!-- Menampilkan Hasil Prediksi dengan Animasi Bouncing -->
                {% if prediction %}
                    <div class="alert alert-success mt-4 text-center fs-5 shadow-sm result-animate">
                        <i class="fas fa-check-circle me-2"></i>Hasil Prediksi: <strong>Iris {{ prediction }}</strong>
                    </div>
                {% endif %}

                <!-- Menampilkan Pesan Error -->
                {% if error %}
                    <div class="alert alert-danger mt-4 result-animate">
                        <i class="fas fa-exclamation-triangle me-2"></i><strong>Kesalahan:</strong> {{ error }}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Modal Loading yang Dipercantik -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 15px; border: none;">
                <div class="modal-body py-4">
                    <!-- Ikon AI berputar -->
                    <i class="fas fa-brain fa-spin fa-4x text-success mb-4"></i>
                    <h5 class="fw-bold">AI Sedang Menganalisis...</h5>
                    <p class="text-muted mb-0">Menjalankan model K-Nearest Neighbors (KNN).</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script Modal -->
    <script>
        document.getElementById('predictionForm').addEventListener('submit', function() {
            var loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
            loadingModal.show();
        });
    </script>
</body>
</html>
